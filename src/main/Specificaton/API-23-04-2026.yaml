openapi: 3.1.0

info:
  title: Agricultural Federation API
  version: 2.0.0
  description: API for managing collectivities, members, and financial accounts

tags:
  - name: Collectivities
    description: Operations related to collectivities

paths:

  /collectivities/{id}:
    get:
      tags:
        - Collectivities
      summary: Get a collectivity by ID
      description: |
        Retrieves a collectivity by its unique identifier.
        The response includes the list of members belonging to the collectivity.
      operationId: getCollectivityById

      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the collectivity
          schema:
            type: string
            example: "col-123"

      responses:
        "200":
          description: Collectivity found successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collectivity"

        "404":
          description: Collectivity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /collectivities/{id}/financialAccounts:
    get:
      tags:
        - Collectivities
      summary: Get financial accounts of a collectivity
      description: |
        Returns the list of financial accounts (cash, mobile banking, bank)
        of a collectivity with their current balance.

        The query parameter `at` allows retrieving the balance at a specific date.
        If historical tracking is not implemented, `at` is ignored.
      operationId: getFinancialAccounts

      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the collectivity
          schema:
            type: string
            example: "col-123"

        - name: at
          in: query
          required: true
          description: Date at which the balances are requested
          schema:
            type: string
            format: date
            example: "2026-04-23"

      responses:
        "200":
          description: List of financial accounts successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinancialAccount"

        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Collectivity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"




components:

  responses:

    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Non authentifié
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Accès interdit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Ressource non trouvée
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    # =========================
    # EXISTING DOMAIN (original)
    # =========================

    CollectiviteCreate:
      type: object
      required: [nom, ville, specialite, cotisationAnnuelle]
      properties:
        nom:
          type: string
        ville:
          type: string
        specialite:
          type: string
        cotisationAnnuelle:
          type: number

    Parrain:
      type: object
      required: [membreId, collectiviteId, relation]
      properties:
        membreId:
          type: integer
        collectiviteId:
          type: integer
        relation:
          type: string

    MembreCreate:
      type: object
      required:
        - nom
        - prenom
        - dateNaissance
        - genre
        - telephone
        - email
      properties:
        nom:
          type: string
        prenom:
          type: string
        dateNaissance:
          type: string
          format: date
        genre:
          type: string
          enum: [masculin, feminin]
        adresse:
          type: string
        metier:
          type: string
        telephone:
          type: string
        email:
          type: string

    CandidatureCreate:
      type: object
      required:
        - collectiviteId
        - candidat
        - parrains
        - paiement
      properties:
        collectiviteId:
          type: integer
        candidat:
          $ref: '#/components/schemas/MembreCreate'
        parrains:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/Parrain'
        paiement:
          type: object
          required: [fraisAdhesion, cotisationAnnuelle, mode]
          properties:
            fraisAdhesion:
              type: number
            cotisationAnnuelle:
              type: number
            montantTotal:
              type: number
            mode:
              type: string
              enum: [mobile_money, virement]

    Paiement:
      type: object
      required: [membreId, montant, mode, date]
      properties:
        membreId:
          type: integer
        montant:
          type: number
        mode:
          type: string
          enum: [espece, virement, mobile_money]
        date:
          type: string
          format: date

    Compte:
      type: object
      properties:
        type:
          type: string
          enum: [caisse, bancaire, mobile_money]
        titulaire:
          type: string
        banque:
          type: string
        numero:
          type: string
        solde:
          type: number

    Activite:
      type: object
      properties:
        nom:
          type: string
        date:
          type: string
          format: date
        obligatoire:
          type: boolean

    Presence:
      type: object
      properties:
        membreId:
          type: integer
        present:
          type: boolean
        excuse:
          type: boolean

    Statistiques:
      type: object
      properties:
        tauxAssiduite:
          type: number
        tauxCotisation:
          type: number
        nombreMembres:
          type: integer
        nouveauxAdherents:
          type: integer

    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: integer

    Collectivity:
      type: object
      properties:
        id:
          type: string
        location:
          type: string
        federationApproval:
          type: boolean
        number:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'

    Member:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
        gender:
          type: string

    FinancialAccount:
      type: object
      required:
        - id
        - collectivityId
        - type
        - amount
      properties:
        id:
          type: string
        collectivityId:
          type: string
        type:
          type: string
          enum: [CASH, MOBILE_BANKING, BANK]
        amount:
          type: number
          format: double

        holderName:
          type: string
          nullable: true

        mobileBankingService:
          type: string
          nullable: true

        mobileNumber:
          type: string
          nullable: true

        bankName:
          type: string
          nullable: true

        bankCode:
          type: integer
          nullable: true

        bankBranchCode:
          type: integer
          nullable: true

        bankAccountNumber:
          type: integer
          nullable: true

        bankAccountKey:
          type: integer
          nullable: true

    ErrorResponse:
      type: object
      required:
        - message
        - timestamp
      properties:
        message:
          type: string
        timestamp:
          type: string
          format: date-time