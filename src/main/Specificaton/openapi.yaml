openapi: 3.0.3

info:
  title: Federation Agricole API
  version: 1.0.0

tags:
  - name: Collectivites
  - name: Candidatures
  - name: Membres
  - name: Paiements
  - name: Comptes
  - name: Activites
  - name: Statistiques
  - name: Federation

paths:

  /collectivites:
    post:
      tags: [Collectivites]
      summary: Créer une collectivité
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectiviteCreate'
      responses:
        201:
          description: Collectivité créée
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'

  /candidatures:
    post:
      tags: [Candidatures]
      summary: Demander une adhésion à une collectivité
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidatureCreate'
      responses:
        201:
          description: Candidature acceptée
        422:
          description: Conditions non respectées
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'

  /membres/{id}/changement-collectivite:
    put:
      tags: [Membres]
      summary: Changer de collectivité
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nouvelleCollectiviteId]
              properties:
                nouvelleCollectiviteId:
                  type: integer
      responses:
        200:
          description: Collectivité mise à jour
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'

  /membres/{id}/demission:
    post:
      tags: [Membres]
      summary: Démissionner de la collectivité
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Membre retiré
        404:
          $ref: '#/components/responses/NotFound'

  /paiements:
    post:
      tags: [Paiements]
      summary: Enregistrer un paiement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Paiement'
      responses:
        201:
          description: Paiement enregistré
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'

  /comptes:
    post:
      tags: [Comptes]
      summary: Créer un compte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Compte'
      responses:
        201:
          description: Compte créé
        400:
          $ref: '#/components/responses/BadRequest'

    get:
      tags: [Comptes]
      summary: Lister les comptes
      responses:
        200:
          description: Liste des comptes
        401:
          $ref: '#/components/responses/Unauthorized'

  /activites:
    post:
      tags: [Activites]
      summary: Créer une activité
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Activite'
      responses:
        201:
          description: Activité créée

    get:
      tags: [Activites]
      summary: Lister les activités
      responses:
        200:
          description: Liste des activités

  /activites/{id}/presence:
    post:
      tags: [Activites]
      summary: Enregistrer présence
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Presence'
      responses:
        201:
          description: Présence enregistrée
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'

  /collectivites/{id}/statistiques:
    get:
      tags: [Statistiques]
      summary: Statistiques collectivité
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: dateDebut
          schema:
            type: string
            format: date
        - in: query
          name: dateFin
          schema:
            type: string
            format: date
      responses:
        200:
          description: Statistiques récupérées
        401:
          $ref: '#/components/responses/Unauthorized'

  /federation/statistiques:
    get:
      tags: [Federation]
      summary: Rapport global fédération
      parameters:
        - in: query
          name: dateDebut
          schema:
            type: string
            format: date
        - in: query
          name: dateFin
          schema:
            type: string
            format: date
      responses:
        200:
          description: Rapport généré
        403:
          $ref: '#/components/responses/Forbidden'

components:

  responses:

    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Non authentifié
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Accès interdit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Ressource non trouvée
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    CollectiviteCreate:
      type: object
      required: [nom, ville, specialite, cotisationAnnuelle]
      properties:
        nom:
          type: string
        ville:
          type: string
        specialite:
          type: string
        cotisationAnnuelle:
          type: number

    Parrain:
      type: object
      required: [membreId, collectiviteId, relation]
      properties:
        membreId:
          type: integer
        collectiviteId:
          type: integer
        relation:
          type: string

    MembreCreate:
      type: object
      required:
        - nom
        - prenom
        - dateNaissance
        - genre
        - telephone
        - email
      properties:
        nom:
          type: string
        prenom:
          type: string
        dateNaissance:
          type: string
          format: date
        genre:
          type: string
          enum: [masculin, feminin]
        adresse:
          type: string
        metier:
          type: string
        telephone:
          type: string
        email:
          type: string

    CandidatureCreate:
      type: object
      required:
        - collectiviteId
        - candidat
        - parrains
        - paiement
      properties:
        collectiviteId:
          type: integer
        candidat:
          $ref: '#/components/schemas/MembreCreate'
        parrains:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/Parrain'
        paiement:
          type: object
          required: [fraisAdhesion, cotisationAnnuelle, mode]
          properties:
            fraisAdhesion:
              type: number
            cotisationAnnuelle:
              type: number
            montantTotal:
              type: number
            mode:
              type: string
              enum: [mobile_money, virement]

    Paiement:
      type: object
      required: [membreId, montant, mode, date]
      properties:
        membreId:
          type: integer
        montant:
          type: number
        mode:
          type: string
          enum: [espece, virement, mobile_money]
        date:
          type: string
          format: date

    Compte:
      type: object
      properties:
        type:
          type: string
          enum: [caisse, bancaire, mobile_money]
        titulaire:
          type: string
        banque:
          type: string
        numero:
          type: string
        solde:
          type: number

    Activite:
      type: object
      properties:
        nom:
          type: string
        date:
          type: string
          format: date
        obligatoire:
          type: boolean

    Presence:
      type: object
      properties:
        membreId:
          type: integer
        present:
          type: boolean
        excuse:
          type: boolean

    Statistiques:
      type: object
      properties:
        tauxAssiduite:
          type: number
        tauxCotisation:
          type: number
        nombreMembres:
          type: integer
        nouveauxAdherents:
          type: integer

    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: integer