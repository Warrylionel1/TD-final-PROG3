openapi: 3.0.3
info:
  title: Federation Agricole API
  version: 1.1.0

paths:

  /collectivites:
    post:
      summary: Créer une collectivité
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectiviteCreate'
      responses:
        201:
          description: Collectivité créée
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        500:
          $ref: '#/components/responses/InternalServerError'

  /collectivites/{id}/membres:
    post:
      summary: Ajouter un membre à une collectivité
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembreCreate'
      responses:
        201:
          description: Membre ajouté avec succès
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          description: Conditions d'admission non remplies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Conditions de parrainage non respectées : parrains de la collectivité cible < parrains extérieurs."
                code: 422

  /paiements:
    post:
      summary: Enregistrer un paiement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Paiement'
      responses:
        201:
          description: Paiement enregistré
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'

  /comptes:
    post:
      summary: Créer un compte
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Compte'
      responses:
        201:
          description: Compte créé
        400:
          $ref: '#/components/responses/BadRequest'

    get:
      summary: Lister les comptes
      responses:
        200:
          description: Liste des comptes
        401:
          $ref: '#/components/responses/Unauthorized'

  /activites:
    post:
      summary: Créer une activité
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Activite'
      responses:
        201:
          description: Activité créée
        400:
          $ref: '#/components/responses/BadRequest'

    get:
      summary: Lister les activités
      responses:
        200:
          description: Liste des activités

  /activites/{id}/presence:
    post:
      summary: Enregistrer une présence à une activité
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Presence'
      responses:
        201:
          description: Présence enregistrée
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'

  /collectivites/{id}/statistiques:
    get:
      summary: Obtenir les statistiques d'une collectivité
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: dateDebut
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: dateFin
          required: false
          schema:
            type: string
            format: date
      responses:
        200:
          description: Statistiques récupérées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statistiques'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'

components:

  responses:

    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Données invalides"
            code: 400

    Unauthorized:
      description: Non authentifié
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Authentification requise"
            code: 401

    Forbidden:
      description: Accès interdit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Accès refusé"
            code: 403

    NotFound:
      description: Ressource non trouvée
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Ressource introuvable"
            code: 404

    InternalServerError:
      description: Erreur serveur
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Erreur interne du serveur"
            code: 500

  schemas:

    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: integer

    CollectiviteCreate:
      type: object
      required: [nom, ville, specialite]
      properties:
        nom:
          type: string
        ville:
          type: string
        specialite:
          type: string

    MembreCreate:
      type: object
      required:
        - nom
        - prenom
        - dateNaissance
        - genre
        - telephone
        - email
        - parrains
        - paiement
      properties:
        nom:
          type: string
        prenom:
          type: string
        dateNaissance:
          type: string
          format: date
        genre:
          type: string
          enum: [masculin, feminin]
        adresse:
          type: string
        metier:
          type: string
        telephone:
          type: string
        email:
          type: string
        parrains:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/Parrain'
        paiement:
          $ref: '#/components/schemas/PaiementAdhesion'

    Parrain:
      type: object
      required:
        - membreId
        - relation
      properties:
        membreId:
          type: integer
        relation:
          type: string
          example: "collègue"

    PaiementAdhesion:
      type: object
      required:
        - montant
        - mode
        - date
      properties:
        montant:
          type: number
          example: 250000
        mode:
          type: string
          enum: [virement, mobile_money]
        date:
          type: string
          format: date

    Paiement:
      type: object
      properties:
        membreId:
          type: integer
        montant:
          type: number
        mode:
          type: string
          enum: [espece, virement, mobile_money]
        date:
          type: string
          format: date

    Compte:
      type: object
      properties:
        type:
          type: string
          enum: [caisse, bancaire, mobile_money]
        titulaire:
          type: string
        banque:
          type: string
        numero:
          type: string
        solde:
          type: number

    Activite:
      type: object
      properties:
        nom:
          type: string
        date:
          type: string
          format: date
        obligatoire:
          type: boolean

    Presence:
      type: object
      properties:
        membreId:
          type: integer
        present:
          type: boolean
        excuse:
          type: boolean

    Statistiques:
      type: object
      properties:
        tauxAssiduite:
          type: number
        nombreMembres:
          type: integer
        details:
          type: array
          items:
            type: object
            properties:
              membreId:
                type: integer
              assiduite:
                type: number
              totalPaiements:
                type: number
              impayes:
                type: number